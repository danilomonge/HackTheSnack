[project]
name = "hack-the-snack"
version = "1.0.0"
description = "HackTheSnack - estimate the recipe of a supermarket product from its ingredient list"
requires-python = ">=3.11"
authors = [
  { name = "Katja Greiffenhagen" },
  { name = "Jana Danner" },
  { name = "Emilio Ribelles" },
  { name = "Danilo Monge" },
]
# Packages bundled into the app (also into the browser build, so keep it lean).
# numpy matches the version Pyodide ships for the Flet web build.
# SciPy is deliberately not bundled: its Pyodide wheel needs a BLAS library
# that `flet build web` does not package, so it cannot be imported in the
# browser (and added ~45 MB). The estimator then finds its starting point with
# NumPy (backend/algorithm/computation.py). Desktop runs use SciPy from
# requirements-dev.txt / environment.yaml.
dependencies = [
  "flet==0.28.3",
  "numpy==2.0.2",
  "httpx==0.28.1",
]

[tool.flet]
org = "com.hackthesnack"
product = "HackTheSnack"
company = "HackTheSnack"
copyright = "Copyright (C) 2025 HackTheSnack"

[tool.flet.app]
# Never ship local build output to the web.
exclude = ["build", "storage", "__pycache__"]

[tool.flet.web]
pwa = true
base_url = "/HackTheSnack/"
route_url_strategy = "hash"

# The Flet 0.28.3 build template overrides the Dart package "web" with "^1.0.0".
# web 1.1.2 (Oct 2026) needs Dart 3.13, newer than Flutter 3.29.2 ships (3.7),
# so dart2js fails. Pin the last compatible release.
[tool.flet.flutter.pubspec.dependency_overrides]
web = "1.1.1"
