[project]
name = "hack-the-snack"
version = "0.1.0"
description = "HackTheSnack - Recipe Generator"
requires-python = ">=3.10"
authors = [
    { name = "HackTheSnack Team" }
]
dependencies = [
  "flet==0.28.3",
  "numpy==2.0.2",
  "scipy==1.14.1",
  "pandas==2.2.3",
  "httpx==0.28.1",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
]

[tool.flet]
org = "com.hackthesnack"
product = "HackTheSnack"
company = "HackTheSnack"
copyright = "Copyright (C) 2025 HackTheSnack"

[tool.flet.web]
pwa = true
base_url = "/HackTheSnack/"
route_url_strategy = "hash"
