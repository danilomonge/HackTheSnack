name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: "stable"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: pip install flet==0.28.3

      - name: Inject public runtime config
        run: |
          cat > ./hts_lib/assets/runtime-config.json <<EOF
          {"nutrition_proxy_url":"${{ vars.NUTRITION_PROXY_URL }}"}
          EOF

      - name: Build web app
        working-directory: ./hts_lib
        run: flet build web

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hts_lib/build/web
          publish_branch: gh-pages
          enable_jekyll: false
