name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: "stable"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: pip install flet==0.28.3

      - name: Write runtime web config
        env:
          NUTRITION_PROXY_URL_VAR: ${{ vars.NUTRITION_PROXY_URL }}
          NUTRITION_PROXY_URL_SECRET: ${{ secrets.NUTRITION_PROXY_URL }}
          USER_MANAGEMENT_URL: ${{ vars.USER_MANAGEMENT_URL }}
        run: |
          PROXY_URL="${NUTRITION_PROXY_URL_VAR:-$NUTRITION_PROXY_URL_SECRET}"
          DB_URL="${USER_MANAGEMENT_URL:-https://fakethesnackdb-api.onrender.com/user-management}"
          if [ -n "$PROXY_URL" ]; then
            cat > ./hts_lib/assets/runtime-config.json <<EOF
          {
            "nutrition_proxy_url": "$PROXY_URL",
            "user_management_url": "$DB_URL"
          }
          EOF
          fi

      - name: Build web app
        working-directory: ./hts_lib
        run: flet build web

      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./hts_lib/build/web
          publish_branch: gh-pages
          enable_jekyll: false
