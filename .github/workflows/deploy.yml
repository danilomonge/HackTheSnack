name: Test and deploy web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  build:
    name: Build web app
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: "stable"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Flet
        run: pip install flet==0.28.3

      # The committed hts_lib/assets/runtime-config.json already points at the
      # production services. Repository variables (or secrets) override them:
      #   USER_MANAGEMENT_URL  -> HackTheSnackDB API base URL
      #   NUTRITION_PROXY_URL  -> nutrition / translation proxy URL
      # These URLs are public; API keys never go into the web build.
      - name: Write runtime web config
        env:
          USER_MANAGEMENT_URL: ${{ vars.USER_MANAGEMENT_URL || secrets.USER_MANAGEMENT_URL }}
          NUTRITION_PROXY_URL: ${{ vars.NUTRITION_PROXY_URL || secrets.NUTRITION_PROXY_URL }}
        run: |
          CONFIG=hts_lib/assets/runtime-config.json
          tmp=$(mktemp)
          jq --arg api "$USER_MANAGEMENT_URL" --arg proxy "$NUTRITION_PROXY_URL" '
            (if $api != "" then .user_management_url = $api else . end)
            | (if $proxy != "" then .nutrition_proxy_url = $proxy else . end)
          ' "$CONFIG" > "$tmp" && mv "$tmp" "$CONFIG"
          cat "$CONFIG"

      # Pull requests build too, so a broken web build never reaches main.
      - name: Build web app
        working-directory: ./hts_lib
        run: flet build web

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: hts_lib/build/web
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          enable_jekyll: false
