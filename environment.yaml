# Conda environment for developing HackTheSnack (app, tests, proxy, notebook).
#   conda env create -f environment.yaml && conda activate mainEnv
name: mainEnv
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # app
  - numpy=2.0.2
  - scipy=1.14.1
  - httpx=0.28.1
  # tests
  - pytest=8.3.4
  # research notebook (notebooks/MakerSpace.ipynb)
  - jupyterlab
  - ipykernel
  - matplotlib
  - tqdm
  - pip:
      - flet[all]==0.28.3
      # nutrition proxy (hts_lib/backend/nutrition_proxy_api.py)
      - fastapi==0.115.12
      - uvicorn==0.34.2
      - tueplots==0.2.0
